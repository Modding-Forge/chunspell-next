name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/ci.yml

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.13"
          enable-cache: true

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install autoconf automake gettext pkg-config libtool hunspell

      - name: Install build tools
        run: uv sync --locked --only-group build --no-install-project

      - name: Build wheels
        run: uv run --no-sync cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp3{8,9,10,11,12,13,14}-*"
          CIBW_ARCHS_LINUX: "auto"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            LD_LIBRARY_PATH={project}/hunspell
            auditwheel repair -w {dest_dir} {wheel}
          CIBW_BEFORE_BUILD_LINUX: |
            if [ -f /etc/debian_version ]; then
              apt update && apt install -y autoconf dh-autoreconf automake autopoint gettext pkg-config libtool libhunspell-dev python3-dev
            elif [ -f /etc/alpine-release ]; then
              apk add autoconf automake libtool gettext-dev python3-dev hunspell-dev linux-headers alpine-sdk
            elif [ -f /etc/redhat-release ]; then
              yum install -y autoconf automake gettext-devel pkgconfig libtool hunspell-devel python3-devel
            else
              echo "Unsupported platform"
              exit 1
            fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-source:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.13"
          enable-cache: true

      - name: Build source distribution
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-source]
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"

      - name: Publish distributions
        run: uv publish dist/*

  publish-github:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wheels, build-source]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
