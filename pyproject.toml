[build-system]
requires = [
    "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project]
name = "chunspell-next"
dynamic = ["version"]
description = "A wrapper on Hunspell for use in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND LGPL-2.1-or-later"
license-files = ["LICENSE", "HUNSPELL_LICENSE_LESSER"]
authors = [
    { name = "cdhigh", email = "akindleear@gmail.com" },
]
keywords = ["hunspell", "spelling", "correction"]
maintainers = [
    { name = "Modding Forge", email = "info@moddingforge.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Utilities",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Modding-Forge/chunspell-next"
Repository = "https://github.com/Modding-Forge/chunspell-next"
Issues = "https://github.com/Modding-Forge/chunspell-next/issues"

[dependency-groups]
dev = [
    "cython>=3.0",
    "pytest>=8.0",
]
build = [
    "cibuildwheel>=3.2.1,<4; python_version >= '3.11'",
]

[tool.setuptools]
include-package-data = true
packages = ["hunspell", "hunspell.dictionaries"]
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "hunspell._version.__version__" }

[tool.setuptools.package-data]
hunspell = [
    "*.cpp",
    "*.dylib",
    "*.dylib.*",
    "*.lib",
    "*.pxd",
    "*.pyx",
    "*.so",
    "*.so.*",
    "dictionaries/*.aff",
    "dictionaries/*.dic",
]
